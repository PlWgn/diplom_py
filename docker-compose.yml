services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: dating
      POSTGRES_USER: dating
      POSTGRES_PASSWORD: dating
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dating -d dating']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7

  web:
    build: .
    command: >
      sh -c 'python manage.py migrate &&
             python manage.py add_demo_users &&
             python manage.py runserver 0.0.0.0:8000'
    environment:
      DEBUG: '1'
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: dating
      POSTGRES_USER: dating
      POSTGRES_PASSWORD: dating
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      REDIS_URL: redis://redis:6379/0
    ports:
      - '8000:8000'
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  media_data:
